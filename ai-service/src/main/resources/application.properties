spring.application.name=ai-service
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Gemini API config
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.max-concurrent-requests=${GEMINI_MAX_CONCURRENT_REQUESTS:1}
gemini.api.max-wait-for-permit-ms=${GEMINI_MAX_WAIT_FOR_PERMIT_MS:2000}
gemini.api.max-retries=${GEMINI_MAX_RETRIES:2}
gemini.api.initial-backoff-ms=${GEMINI_INITIAL_BACKOFF_MS:1000}
gemini.api.max-backoff-ms=${GEMINI_MAX_BACKOFF_MS:5000}

# Chat endpoint rate limit
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}
