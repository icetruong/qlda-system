spring.application.name=ai-service
spring.datasource.url=jdbc:postgresql://localhost:5433/QLDA
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Gemini API config
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.max-concurrent-requests=${GEMINI_MAX_CONCURRENT_REQUESTS:1}
gemini.api.max-wait-for-permit-ms=${GEMINI_MAX_WAIT_FOR_PERMIT_MS:2000}
gemini.api.max-retries=${GEMINI_MAX_RETRIES:2}
gemini.api.initial-backoff-ms=${GEMINI_INITIAL_BACKOFF_MS:1000}
gemini.api.max-backoff-ms=${GEMINI_MAX_BACKOFF_MS:5000}

# Chat endpoint rate limit
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:10}

# Internal service-to-service auth
DOCUMENT_SERVICE_BASE_URL=${DOCUMENT_SERVICE_BASE_URL:http://localhost:8081}
WORKFLOW_SERVICE_BASE_URL=${WORKFLOW_SERVICE_BASE_URL:http://localhost:8082}
AUTH_SERVICE_BASE_URL=${AUTH_SERVICE_BASE_URL:http://localhost:8083}
INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:}
SERVICE_NAME=${SERVICE_NAME:ai-service}
CHATBOT_TOP_K=5
