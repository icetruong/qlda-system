spring:
  application:
    name: workflow-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/QLDA}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Bangkok
  cloud:
    compatibility-verifier:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  kafka:
    notification-topic: ${NOTIFICATION_EVENTS_TOPIC:notification-events}

services:
  document-service:
    base-url: ${DOCUMENT_SERVICE_URL:http://localhost:8082}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

internal:
  auth:
    service-name: ${INTERNAL_SERVICE_NAME:workflow-service}
    service-token: ${INTERNAL_SERVICE_TOKEN:change-me-in-dev}
    allowed-services:
      - document-service
      - report-service
      - support-service
