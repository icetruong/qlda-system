spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

eureka:
  client:
    enabled: false

internal:
  auth:
    service-name: document-service
    service-token: internal-token
    allowed-services:
      - workflow-service
      - ai-service
      - report-service
      - support-service
      - notification-service
