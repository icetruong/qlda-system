spring:
  application:
    name: document-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/QLDA}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  cloud:
    compatibility-verifier:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  kafka:
    notification-topic: ${NOTIFICATION_EVENTS_TOPIC:notification-events}

services:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  workflow-service:
    base-url: ${WORKFLOW_SERVICE_URL:http://localhost:8083}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8084}

internal:
  auth:
    service-name: ${INTERNAL_SERVICE_NAME:document-service}
    service-token: ${INTERNAL_SERVICE_TOKEN:change-me-in-dev}
    allowed-services:
      - workflow-service
      - ai-service
      - report-service
      - support-service
      - notification-service