spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**
        - id: workflow-service
          uri: lb://workflow-service
          predicates:
            - Path=/api/workflows/**
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/api/notifications/**,/api/audit-logs/**,/api/reports/**
      # TODO: Add versioned route rewrite for /api/v1/** when all downstream services adopt v1 contract.
      # TODO: Enable Redis-backed RequestRateLimiter filter when Redis is provisioned.
      # default-filters:
      #   - name: RequestRateLimiter
      #     args:
      #       key-resolver: "#{@ipKeyResolver}"
      #       redis-rate-limiter.replenishRate: 10
      #       redis-rate-limiter.burstCapacity: 20
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
